<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Галерея - Академия</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Стили для логотипа и галереи -->
  <style>
    .logo { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: bold; color: #4a90e2; }
    .logo img { height: 50px; width: auto; border-radius: 50%; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 20px; max-width: 1100px; margin: 0 auto; }
    .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; transition: transform 0.3s; cursor: pointer; }
    .gallery img:hover { transform: scale(1.03); }
  </style>
</head>
<body>
  <header>
    <!-- Блок с логотипом -->
    <div class="logo">
      <img src="logo.png" alt="Логотип Академия">

    </div>
    
    <nav>
      <a href="index.html">Главная</a>
      <a href="about.html">О нас</a>
      <a href="programs.html">Программы</a>
      <a href="gallery.html">Галерея</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <section class="features">
    <h2>Фотогалерея</h2>
    <p style="margin-bottom: 20px;">Как проходят наши будни</p>
    
    <div class="gallery">
      <!-- Замените названия ниже на те, что вы загрузили (например, photo1.jpg.png) -->
      <img src="photo1.jpg.png" alt="Фото садика">
      <img src="photo2.jpg.png" alt="Фото садика">
      <img src="photo3.jpg.png" alt="Фото садика">
      <img src="photo4.jpg.png" alt="Фото садика">
      <img src="photo5.jpg.png" alt="Фото садика">
      <img src="photo6.jpg.png" alt="Фото садика">
    </div>
  </section>

  <footer>
    <p>© 2025 Частный садик "Академия". Все права защищены.</p>
  </footer>
</body>
</html>
