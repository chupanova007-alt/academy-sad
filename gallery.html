<!DOCTYPE html>

  <title>Галерея - Академия</title>
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Стили для логотипа */
    .logo { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: bold; color: #4a90e2; }
    .logo img { height: 50px; width: auto; border-radius: 50%; }
    
    /* Стили для галереи */
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Адаптивная сетка */
      gap: 20px; 
      padding: 20px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    
    .gallery img { 
      width: 100%; 
      height: 250px; 
      object-fit: cover; /* Фото не будут сплющиваться */
      border-radius: 10px; 
      transition: transform 0.3s, box-shadow 0.3s; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .gallery img:hover { 
      transform: scale(1.05); /* Красивое увеличение при наведении */
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      z-index: 2;
    }
  </style>
</head>
